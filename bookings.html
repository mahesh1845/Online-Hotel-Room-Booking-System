<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LuxuryStay - My Bookings</title>

    <link rel="stylesheet" href="css/style.css">

    <style>

        .bookings-page {
            max-width: 1100px;
            margin: 50px auto;
            padding: 0 20px;
        }

        .bookings-title {
            text-align: center;
            margin-bottom: 35px;
        }

        .bookings-title h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .bookings-title p {
            color: #666;
        }

        .booking-list {
            display: grid;
            gap: 25px;
        }

        .booking-card {
            background: white;
            padding: 25px;
            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .booking-header {
            display: flex;
            justify-content: space-between;
            align-items: center;

            border-bottom: 1px solid #ddd;
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .booking-header h2 {
            font-size: 22px;
        }

        .booking-status {
            background: #d1fae5;
            color: #065f46;

            padding: 6px 12px;
            border-radius: 20px;

            font-size: 14px;
            font-weight: bold;
        }

        .booking-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .detail {
            padding: 10px;
        }

        .detail strong {
            display: block;
            margin-bottom: 5px;
        }

        .detail span {
            color: #666;
        }

        .booking-total {
            margin-top: 20px;
            padding-top: 15px;

            border-top: 1px solid #ddd;

            font-size: 22px;
            font-weight: bold;
        }

        .cancel-btn {
            margin-top: 15px;

            padding: 10px 18px;

            border: none;
            border-radius: 6px;

            background-color: #dc2626;
            color: white;

            cursor: pointer;
            font-weight: bold;
        }

        .cancel-btn:hover {
            background-color: #b91c1c;
        }

        .no-bookings {
            text-align: center;
            background: white;

            padding: 50px 20px;

            border-radius: 12px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.08);
        }

        .no-bookings h2 {
            margin-bottom: 15px;
        }

        .no-bookings p {
            color: #666;
            margin-bottom: 20px;
        }

        @media (max-width: 600px) {

            .booking-details {
                grid-template-columns: 1fr;
            }

            .booking-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .bookings-page {
                padding: 0 15px;
            }
        }

    </style>

</head>


<body>

    <!-- Navigation -->
    <header>

        <nav class="navbar">

            <div class="logo">
                🏨 LuxuryStay
            </div>

            <ul class="nav-links">

                <li>
                    <a href="index.html">Home</a>
                </li>

                <li>
                    <a href="rooms.html">Rooms</a>
                </li>

                <li>
                    <a href="booking.html">Booking</a>
                </li>

                <li>
                    <a href="bookings.html">My Bookings</a>
                </li>

                <li>
                    <a href="login.html">Login</a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- My Bookings -->
    <main class="bookings-page">

        <div class="bookings-title">

            <h1>My Bookings</h1>

            <p>
                View and manage your hotel bookings.
            </p>

        </div>


        <!-- Booking list -->
        <div
            id="bookingList"
            class="booking-list">
        </div>

    </main>


    <!-- Footer -->
    <footer>

        <div class="footer-content">

            <h3>🏨 LuxuryStay</h3>

            <p>
                Your comfort is our priority.
            </p>

            <p>
                © 2026 LuxuryStay. All Rights Reserved.
            </p>

        </div>

    </footer>


    <!-- JavaScript -->
    <script>

        const bookingList =
            document.getElementById("bookingList");


        // Get bookings from localStorage
        let bookings =
            JSON.parse(
                localStorage.getItem("bookings")
            ) || [];


        // Display bookings
        function displayBookings() {

            bookingList.innerHTML = "";


            // No bookings
            if (bookings.length === 0) {

                bookingList.innerHTML = `

                    <div class="no-bookings">

                        <h2>
                            📭 No Bookings Found
                        </h2>

                        <p>
                            You have not made any bookings yet.
                        </p>

                        <a
                            href="rooms.html"
                            class="btn">
                            Browse Rooms
                        </a>

                    </div>

                `;

                return;
            }


            // Display each booking
            bookings.forEach(
                (booking, index) => {

                    const card =
                        document.createElement("div");

                    card.className =
                        "booking-card";


                    card.innerHTML = `

                        <div class="booking-header">

                            <h2>
                                🏨 ${booking.room}
                            </h2>

                            <span class="booking-status">
                                Confirmed
                            </span>

                        </div>


                        <div class="booking-details">

                            <div class="detail">

                                <strong>
                                    👤 Guest Name
                                </strong>

                                <span>
                                    ${booking.name}
                                </span>

                            </div>


                            <div class="detail">

                                <strong>
                                    📧 Email
                                </strong>

                                <span>
                                    ${booking.email}
                                </span>

                            </div>


                            <div class="detail">

                                <strong>
                                    📞 Phone
                                </strong>

                                <span>
                                    ${booking.phone}
                                </span>

                            </div>


                            <div class="detail">

                                <strong>
                                    👥 Guests
                                </strong>

                                <span>
                                    ${booking.guests}
                                </span>

                            </div>


                            <div class="detail">

                                <strong>
                                    📅 Check-in
                                </strong>

                                <span>
                                    ${booking.checkin}
                                </span>

                            </div>


                            <div class="detail">

                                <strong>
                                    📅 Check-out
                                </strong>

                                <span>
                                    ${booking.checkout}
                                </span>

                            </div>


                            <div class="detail">

                                <strong>
                                    🕐 Booking Date
                                </strong>

                                <span>
                                    ${booking.bookingDate}
                                </span>

                            </div>

                        </div>


                        <div class="booking-total">

                            Total:
                            ₹${booking.total}

                        </div>


                        <button
                            class="cancel-btn"
                            onclick="cancelBooking(${index})">

                            Cancel Booking

                        </button>

                    `;


                    bookingList.appendChild(card);

                }
            );

        }


        // Cancel booking
        function cancelBooking(index) {

            const confirmCancel =
                confirm(
                    "Are you sure you want to cancel this booking?"
                );


            if (!confirmCancel) {
                return;
            }


            // Remove booking
            bookings.splice(index, 1);


            // Save updated bookings
            localStorage.setItem(
                "bookings",
                JSON.stringify(bookings)
            );


            // Refresh page content
            displayBookings();

        }


        // Display when page loads
        displayBookings();

    </script>

</body>

</html>
